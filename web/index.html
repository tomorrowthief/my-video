<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>讲解视频</title>
		<meta name="description" content="用 Remotion 做的技术与数学讲解视频" />
		<style>
			:root {
				--bg: #06070b;
				--panel: #12151d;
				--border: #242a38;
				--border-hi: #333b4d;
				--text: #e7eaf2;
				--dim: #8a93a8;
				--faint: #5b6478;
				--accent: #7d8cff;
				--font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
				--mono: "SF Mono", "JetBrains Mono", Menlo, monospace;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				/* Safe-area padding keeps the header clear of a phone notch. */
				padding: max(32px, env(safe-area-inset-top)) 24px 72px;
				background: var(--bg);
				color: var(--text);
				font-family: var(--font);
				-webkit-font-smoothing: antialiased;
				line-height: 1.6;
			}

			/* The same drifting glow the videos open on, so the page and the
			   content it hosts read as one thing. */
			body::before {
				content: "";
				position: fixed;
				inset: 0;
				pointer-events: none;
				background:
					radial-gradient(1100px 700px at 18% 8%, rgba(125, 140, 255, 0.16), transparent 62%),
					radial-gradient(900px 620px at 88% 96%, rgba(47, 211, 189, 0.08), transparent 60%);
			}

			main {
				position: relative;
				max-width: 940px;
				margin: 0 auto;
			}

			header {
				margin-bottom: 44px;
			}

			h1 {
				font-size: clamp(30px, 5vw, 44px);
				font-weight: 600;
				letter-spacing: -0.01em;
				margin: 0 0 12px;
			}

			.sub {
				color: var(--dim);
				font-size: clamp(15px, 2.4vw, 18px);
				margin: 0;
			}

			.sub code {
				font-family: var(--mono);
				font-size: 0.92em;
				color: var(--accent);
			}

			article {
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 16px;
				padding: 22px;
				margin-bottom: 26px;
			}

			.head {
				display: flex;
				align-items: baseline;
				gap: 14px;
				flex-wrap: wrap;
				margin-bottom: 16px;
			}

			h2 {
				font-size: clamp(19px, 3vw, 24px);
				font-weight: 600;
				margin: 0;
			}

			.meta {
				font-family: var(--mono);
				font-size: 14px;
				color: var(--faint);
				margin-left: auto;
				white-space: nowrap;
			}

			.blurb {
				color: var(--dim);
				font-size: 15px;
				margin: 0 0 18px;
			}

			video {
				display: block;
				width: 100%;
				aspect-ratio: 16 / 9;
				background: #000;
				border: 1px solid var(--border-hi);
				border-radius: 10px;
			}

			footer {
				color: var(--faint);
				font-size: 14px;
				text-align: center;
				margin-top: 56px;
			}

			footer a {
				color: var(--dim);
			}

			.missing {
				display: flex;
				align-items: center;
				justify-content: center;
				aspect-ratio: 16 / 9;
				border: 1px dashed var(--border-hi);
				border-radius: 10px;
				color: var(--faint);
				font-family: var(--mono);
				font-size: 14px;
				text-align: center;
				padding: 20px;
			}
		</style>
	</head>
	<body>
		<main>
			<header>
				<h1>讲解视频</h1>
				<p class="sub">
					用 <code>Remotion</code> 做的技术与数学讲解。每支的节奏都由旁白音频决定 ——
					改一句话，整片自动重剪。
				</p>
			</header>

			<div id="list"></div>

			<footer>用 Remotion 渲染 · 托管于 Cloudflare Pages + R2</footer>
		</main>

		<script>
			// Where the mp4s live. Point this at your R2 public bucket (or a custom
			// domain in front of it) — Pages itself refuses any file over 25 MiB,
			// which every one of these videos exceeds except the shortest.
			const R2_BASE = "https://REPLACE-ME.r2.dev";

			const VIDEOS = [
				{
					file: "chicken-rabbit.mp4",
					title: "鸡兔同笼",
					meta: "2:54 · 小学数学",
					blurb:
						"同一道题的三种解法 —— 列表、假设、抬腿 —— 其实讲的是同一句话：一只兔比一只鸡多两只脚。",
				},
				{
					file: "python-roadmap.mp4",
					title: "Python 进阶路线图",
					meta: "16:56 · 编程",
					blurb:
						"四层地图：语言内核、并发与性能、工程化、生态方向。十个知识点，每个都带一个可验证的产出。",
				},
				{
					file: "pi-durable.mp4",
					title: "pi-durable：可恢复的 Agent 循环",
					meta: "15:43 · 架构",
					blurb: "把 Agent 循环重写成状态机，断电重启能从最后一个检查点继续，并且知道哪些工具不能重跑。",
				},
			];

			document.getElementById("list").innerHTML = VIDEOS.map(
				(v) => `
				<article>
					<div class="head">
						<h2>${v.title}</h2>
						<span class="meta">${v.meta}</span>
					</div>
					<p class="blurb">${v.blurb}</p>
					${
						R2_BASE.includes("REPLACE-ME")
							? `<div class="missing">把 index.html 里的 R2_BASE 换成你的 R2 公开地址<br />当前应指向 ${v.file}</div>`
							: `<video controls preload="metadata" playsinline src="${R2_BASE}/${v.file}"></video>`
					}
				</article>`,
			).join("");
		</script>
	</body>
</html>
